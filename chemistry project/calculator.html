<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Winfred Lubanga">
    <meta name="description"
        content="Analytical Chemistry Calculator helps students and lab technicians calculate molar mass, solution concentration, and required mass accurately.">

    <title>Analytical Chemistry Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="calculator.html">Calculator</a></li>
                <li><a href="references.html">References</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Analytical Chemistry Formula Calculator</h1>

        <form id="chemForm">
            <label for="formula">Chemical Formula:</label>
            <input type="text" id="formula" required>

            <label for="volume">Volume (L):</label>
            <input type="number" id="volume" step="0.001" required>

            <button type="submit">Calculate</button>
        </form>

        <div id="results"></div>
    </main>

    <footer>
        <p>&copy; 2026 Analytical Chemistry Calculator - Winfred Lubanga | <a href="references.html">References</a></p>
    </footer>

    <script src="script.js"></script>
