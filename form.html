<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Submit a product review including ratings, features, and feedback using this responsive product review form.">
    <meta name="author" content="Winfred Lubanga">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="css/form.css">
    <script src="js/products.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating</legend>

                <input type="radio" id="rate1" name="rating" value="1" required>
                <label for="rate1">☆</label>

                <input type="radio" id="rate2" name="rating" value="2" required>
                <label for="rate2">☆☆</label>

                <input type="radio" id="rate3" name="rating" value="3" required>
                <label for="rate3">☆☆☆</label>

                <input type="radio" id="rate4" name="rating" value="4" required>
                <label for="rate4">☆☆☆☆</label>

                <input type="radio" id="rate5" name="rating" value="5" required>
                <label for="rate5">☆☆☆☆☆</label>
            </fieldset>

            <!-- Date of Installation -->
            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <!-- Useful Features -->
            <fieldset>
                <legend>Useful Features</legend>

                <input type="checkbox" id="feature1" name="features" value="durability">
                <label for="feature1">Durability</label>

                <input type="checkbox" id="feature2" name="features" value="design">
                <label for="feature2">Design</label>

                <input type="checkbox" id="feature3" name="features" value="performance">
                <label for="feature3">Performance</label>

                <input type="checkbox" id="feature4" name="features" value="ease">
                <label for="feature4">Ease of Use</label>
            </fieldset>

            <!-- Written Review -->
            <label for="review">Written Review</label>
            <textarea id="review" name="review"></textarea>

            <!-- User Name -->
            <label for="username">Your Name</label>
            <input type="text" id="username" name="username">

            <!-- Submit -->
            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>© 2026 | WDD 131 Product Review</p>
    </footer>
</body>

</html>
