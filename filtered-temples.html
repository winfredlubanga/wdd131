<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filtered Temple Album</title>
    <meta name="description"
        content="Temple Album showcasing images and information about temples, dynamically generated and filterable.">
    <meta name="author" content="Winfred Lubanga">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/filtered-temples.css">
    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>

    <header>
        <span class="site-title">Temple Album</span>
        <nav>
            <button id="menuButton" aria-label="Menu">&#9776;</button>
            <ul id="navMenu">
                <li><button id="homeBtn">Home</button></li>
                <li><button id="oldBtn">Old</button></li>
                <li><button id="newBtn">New</button></li>
                <li><button id="largeBtn">Large</button></li>
                <li><button id="smallBtn">Small</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Temples</h1>
        <section id="temple-cards" class="temple-cards">
            <!-- Temple cards will be dynamically generated here -->
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Winfred Lubanga | Kenya</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
