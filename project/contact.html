<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact | Kenya Travel Guide</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Kenya Travel Guide for travel inquiries.">
    <meta name="author" content="Winfred Lubanga">

    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header>
        <h1>Kenya Travel Guide</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Contact Us</h2>

            <form id="contactForm">
                <label for="name">Full Name:</label>
                <input type="text" id="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" required>

                <label for="destination">Preferred Destination:</label>
                <select id="destination" required>
                    <option value="">Select a destination</option>
                    <option value="Maasai Mara">Maasai Mara</option>
                    <option value="Diani Beach">Diani Beach</option>
                    <option value="Mount Kenya">Mount Kenya</option>
                </select>

                <label for="message">Message:</label>
                <textarea id="message" required></textarea>

                <button type="submit">Submit</button>
            </form>

            <div id="formResponse"></div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Kenya Travel Guide | Winfred Lubanga</p>
        <p><a href="references.html">References</a></p>
    </footer>

</body>

</html>
